# ============================================================
# 添加物に関するルール
# ============================================================

分類: 添加物
説明: 一括表示の「添加物」欄（または原材料名欄の添加物部分）に関するルール。

ルール:
  - id: additive-weight-order
    名称: 添加物も重量の多い順に表示する
    根拠: 食品表示基準 第3条第1項（添加物）／食品添加物表示に関するマメ知識 p3
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/food_additive/assets/food_labeling_cms204_210408_01.pdf
    最終確認日: ""
    条件: 添加物が2つ以上あるとき
    判定: 添加物に占める重量の割合の高いものから順に並んでいること
    重大度: error
    メッセージ: 添加物も「添加物に占める重量の割合の高いものから順」に並べます。並び順を確認してください。
    ヒント: 原材料の重量順とは別に、添加物の中だけで重量順に並べます。機械では判定できません。
    機械判定:
      種別: 確認事項

  - id: additive-substance-name
    名称: 添加物は物質名で表示する（簡略名・類別名も可）
    根拠: 食品表示基準 第3条第1項（添加物）／食品表示基準について 別添 添加物関係
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/food_additive/assets/food_labeling_cms204_210408_01.pdf
    最終確認日: ""
    条件: 添加物が1つ以上あるとき
    判定: 原則として物質名で表示していること（通知で認められた簡略名・類別名も可）
    重大度: warn
    メッセージ: 添加物は原則すべて「物質名」で表示します。簡略名・類別名を使う場合は、通知（食品表示基準について 別添 添加物関係）で認められた範囲か確認してください。
    ヒント: 簡略名の例：「亜硝酸Na」（亜硝酸ナトリウム）、「重曹」（炭酸水素ナトリウム）、「ビタミンC」（L-アスコルビン酸）。類別名の例：「果実色素」「ビタミンB1」。
    機械判定:
      種別: 確認事項

  - id: additive-usage-name-8
    名称: 用途名の併記が必要な8用途
    根拠: 食品表示基準 別表第6（用途名を併記する添加物）／食品添加物表示に関するマメ知識 p5
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/food_additive/assets/food_labeling_cms204_210408_01.pdf
    最終確認日: ""
    条件: 別表第6に掲げる用途（甘味料／着色料／保存料／増粘剤・安定剤・ゲル化剤・糊料／酸化防止剤／発色剤／漂白剤／防かび剤・防ばい剤）の添加物を使用しているとき
    判定: 「用途名（物質名）」の形式で、用途名と物質名の両方が表示されていること
    重大度: error
    メッセージ: 「{用途名}」は用途名の併記が必要な8用途のひとつです。「{用途名}（物質名）」の形で物質名も書いてください。
    ヒント: |
      正しい例：保存料（ソルビン酸）／着色料（カラメル）／酸化防止剤（ビタミンE）／増粘剤（キサンタンガム）／甘味料（ステビア）
      誤りの例：「保存料」だけ、「ソルビン酸」だけ
      用途名の併記が必要な8用途：甘味料、着色料、保存料、増粘剤・安定剤・ゲル化剤・糊料、酸化防止剤、発色剤、漂白剤、防かび剤（防ばい剤）
    機械判定:
      種別: 用途名併記
      用途名一覧:
        - 甘味料
        - 着色料
        - 保存料
        - 増粘剤
        - 安定剤
        - ゲル化剤
        - 糊料
        - 酸化防止剤
        - 発色剤
        - 漂白剤
        - 防かび剤
        - 防ばい剤

  - id: additive-collective-name
    名称: 一括名で表示できる14種類
    根拠: 食品表示基準 別表第7（一括名）／食品添加物表示に関するマメ知識 p5
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/food_additive/assets/food_labeling_cms204_210408_01.pdf
    最終確認日: ""
    条件: 一括名（香料、調味料、乳化剤 など）で表示しているとき
    判定: 一括名で表示できるのは別表第7の14種類に限られ、かつ通知で定める範囲の添加物であること
    重大度: warn
    メッセージ: 一括名で表示できるのは次の14種類だけです。使用している添加物がその範囲に収まっているか確認してください。
    ヒント: |
      一括名で表示できる14種類：
      イーストフード／ガムベース／かんすい／酵素／光沢剤／香料／酸味料／
      チューインガム軟化剤／調味料／豆腐用凝固剤／苦味料／乳化剤／
      水素イオン濃度調整剤（pH調整剤）／膨脹剤（膨張剤）
      なお「調味料」は「調味料（アミノ酸等）」のように種類を括弧書きします。
    機械判定:
      種別: 確認事項

  - id: additive-exemption
    名称: 表示が免除される添加物（加工助剤・キャリーオーバー・栄養強化目的）
    根拠: 食品表示基準 第3条第1項（添加物）／食品添加物表示に関するマメ知識 p5
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/food_additive/assets/food_labeling_cms204_210408_01.pdf
    最終確認日: ""
    条件: 加工助剤・キャリーオーバー・栄養強化目的の添加物があるとき
    判定: 免除の要件を満たしていること。ただしアレルゲンについては免除されないこと
    重大度: warn
    メッセージ: 加工助剤・キャリーオーバー・栄養強化目的の添加物は表示を省略できますが、それらが特定原材料に由来する場合はアレルゲンの表示が必要です。
    ヒント: 「加工助剤及びキャリーオーバーなど、添加物の表示が免除されているものであっても、特定原材料については、表示する必要がある」（別添 アレルゲンを含む食品に関する表示 第1-3(6)④）。特定原材料に準ずるものも可能な限り表示に努めます。
    機械判定:
      種別: 確認事項

  - id: additive-l-phenylalanine
    名称: L-フェニルアラニン化合物を含む旨の表示
    根拠: 食品表示基準 第3条第2項（L-フェニルアラニン化合物を含む旨）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: アスパルテームを使用しているとき
    判定: 「L-フェニルアラニン化合物を含む」旨が表示されていること
    重大度: error
    メッセージ: アスパルテームを使用している食品には「L-フェニルアラニン化合物を含む」旨の表示が必要です。
    ヒント: 添加物欄に「甘味料（アスパルテーム・L-フェニルアラニン化合物）」と書く方法や、注意喚起欄に「L-フェニルアラニン化合物を含む」と書く方法があります。
    機械判定:
      種別: Lフェニルアラニン

  - id: additive-no-additive-claim
    名称: 「無添加」「不使用」表示の注意
    根拠: 食品表示基準 第9条（表示禁止事項）／食品添加物の不使用表示に関するガイドライン（令和4年3月30日）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/
    最終確認日: ""
    条件: 「無添加」「不使用」等の表示を行うとき
    判定: 消費者を誤認させる表示、表示すべき事項と矛盾する表示になっていないこと
    重大度: warn
    メッセージ: 「○○無添加」「○○不使用」の表示は、消費者庁のガイドラインで10類型の注意すべき表示が示されています。該当しないか確認してください。
    ヒント: 例：同一機能・類似機能の添加物を使っているのに「無添加」と書く、食品添加物の使用が認められていない食品に「不使用」と書く、などは問題となり得ます。
    機械判定:
      種別: 確認事項
