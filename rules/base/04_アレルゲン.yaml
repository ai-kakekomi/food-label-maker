# ============================================================
# アレルゲン（特定原材料等）に関するルール
#
# 表示漏れが最も重大な事故につながる領域です。
# 品目リストと代替表記は 00_アレルゲン辞書.yaml にまとめています。
# ============================================================

分類: アレルゲン
説明: 特定原材料9品目（義務）と特定原材料に準ずるもの20品目（推奨）の表示ルール（2026年4月1日改正対応）。

ルール:
  - id: allergen-mandatory-8
    名称: 特定原材料9品目の表示義務
    根拠: 食品表示基準 別表第14／別添 アレルゲンを含む食品に関する表示 第1-2(1)
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/allergy/
    最終確認日: "2026-08-20"
    条件: 原材料または添加物に特定原材料（えび・カシューナッツ・かに・くるみ・小麦・そば・卵・乳・落花生）を含むとき
    判定: その特定原材料を含む旨が表示されていること
    重大度: error
    メッセージ: 「{品目}」は特定原材料（表示義務9品目）です。表示が見当たりません。
    ヒント: |
      表示方法は2通りあり、混ぜて使うことはできません。
      ・個別表示：原材料名の直後に「（○○を含む）」を付ける
      ・一括表示：原材料欄の最後に「（一部に○○・△△を含む）」とまとめて書く
      カシューナッツは2026年4月1日の改正で義務表示になりました（経過措置は2028年3月31日まで。新しく作るラベルでは表示してください）。
      なお、原材料名そのものが代替表記・拡大表記（例：小麦粉、マヨネーズ）になっている場合は、
      その表記をもって「含む旨」の表示に代えることができます。
    機械判定:
      種別: アレルゲン表示
      対象範囲: 特定原材料

  - id: allergen-recommended-20
    名称: 特定原材料に準ずるもの20品目の表示（推奨）
    根拠: 食品表示基準について 別添 アレルゲンを含む食品に関する表示 第1-2(2)
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/allergy/
    最終確認日: "2026-08-20"
    条件: 原材料または添加物に特定原材料に準ずるもの20品目を含むとき
    判定: 可能な限り表示するよう努めること
    重大度: warn
    メッセージ: 「{品目}」は特定原材料に準ずるもの（表示を推奨する20品目）です。可能な限り表示してください。
    ヒント: 20品目＝アーモンド、あわび、いか、いくら、オレンジ、キウイフルーツ、牛肉、ごま、さけ、さば、大豆、鶏肉、バナナ、ピスタチオ、豚肉、マカダミアナッツ、もも、やまいも、りんご、ゼラチン（2026年4月1日改正：カシューナッツは義務表示へ格上げ、ピスタチオを追加）。義務ではありませんが、表示しない場合、アレルギー患者は「入っていない」のか「表示していないだけ」なのか判断できません。
    機械判定:
      種別: アレルゲン表示
      対象範囲: 特定原材料に準ずるもの

  - id: allergen-milk-notation
    名称: 「乳」は「乳成分を含む」と表示する
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(1)①
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 原材料に乳を含み、含む旨を表示するとき
    判定: 「乳を含む」ではなく「乳成分を含む」と表示されていること
    重大度: error
    メッセージ: 原材料のアレルゲン表示では、乳は「乳成分を含む」と書きます。「乳を含む」は誤りです。
    ヒント: 一括表示の場合も「（一部に乳成分を含む）」と書きます。ただし添加物の由来表示は「乳由来」（「乳成分由来」ではない）です。
    機械判定:
      種別: 乳の表記

  - id: allergen-milk-derived
    名称: 乳由来の添加物は「乳由来」と表示する
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(1)②
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 添加物が乳に由来するとき
    判定: 「乳成分由来」ではなく「乳由来」と表示されていること
    重大度: error
    メッセージ: 添加物のアレルゲン表示では、乳は「乳由来」と書きます。「乳成分由来」は誤りです。
    ヒント: 添加物は「物質名（○○由来）」の形です。用途名を併記する場合は「用途名（物質名：○○由来）」と書きます（二重括弧より「：」が望ましい）。
    機械判定:
      種別: 乳由来の表記

  - id: allergen-additive-derived-form
    名称: 添加物のアレルゲンは「由来」と表示する
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(1)②
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 添加物が特定原材料等に由来するとき
    判定: 添加物には「（○○由来）」と表示していること（原材料の「（○○を含む）」とは書き方が異なる）
    重大度: warn
    メッセージ: 添加物のアレルゲンは「（○○由来）」と表示します。原材料の「（○○を含む）」と書き方が違う点に注意してください。
    ヒント: 例：「乳化剤（大豆由来）」「甘味料（○○：小麦由来）」。一括名で表示する場合は一括名の直後に括弧を付けます（例：「調味料（アミノ酸等）（小麦由来）」）。
    機械判定:
      種別: 確認事項

  - id: allergen-method-no-mixing
    名称: 個別表示と一括表示の併用禁止
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(3)
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: アレルゲン表示があるとき
    判定: 個別表示と一括表示のどちらか一方に統一されていること
    重大度: error
    メッセージ: 個別表示（原材料ごとに「（○○を含む）」）と一括表示（「（一部に○○を含む）」）を組み合わせて使うことはできません。どちらかに統一してください。
    ヒント: 本ツールでは「アレルゲン表示の方式」で個別表示か一括表示を選びます。選んだ方式と実際の書き方が食い違っていないか確認します。
    機械判定:
      種別: アレルゲン方式併用

  - id: allergen-ikkatsu-all
    名称: 一括表示するときは全てのアレルゲンを列挙する
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(3)
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 一括表示方式を選んでいるとき
    判定: 代替表記等で既に表示されているものも含め、その食品に含まれる全ての特定原材料等が「（一部に○○・△△を含む）」に列挙されていること
    重大度: error
    メッセージ: 一括表示にする場合は、原材料名からアレルゲンが読み取れるもの（例：小麦粉、卵黄）も含めて、全て「（一部に…を含む）」に書き出す必要があります。
    ヒント: 個別表示では代替表記による省略が認められますが、一括表示では省略できません。書く場所は原材料欄の最後です（原材料と添加物を別欄にしている場合は、それぞれの欄の最後）。
    機械判定:
      種別: アレルゲン一括網羅
    適用条件:
      - 対象: アレルゲン表示方式
        演算: 等しい
        値: 一括表示

  - id: allergen-no-possibility-wording
    名称: 「入っているかもしれない」等の可能性表示の禁止
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(6)②
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 表示のどこかに可能性を示す表現があるとき
    判定: 「入っているかもしれない」等の可能性表示を使っていないこと
    重大度: error
    メッセージ: アレルゲンについて「入っているかもしれない」等の可能性表示は認められません（一括表示の枠外でも同じです）。
    ヒント: コンタミネーション（意図しない混入）の注意喚起は、可能性表示とは別のものとして枠外に書くことが推奨されています（例：「本品製造工場では落花生を含む製品を生産しています」）。
    機械判定:
      種別: 正規表現禁止
      対象: 全文
      パターン: "かもしれ|入っている場合があります|含む場合があり|混入の可能性"

  - id: allergen-no-broad-category
    名称: 大分類でのまとめ表示の禁止
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(6)③
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 原材料名に「穀類」「魚介類」等の大分類表記があるとき
    判定: 「穀類（小麦、大豆）」を単に「穀類」とするような大分類表示をしていないこと
    重大度: warn
    メッセージ: アレルゲンを大分類でまとめて表示することは認められていません（例：「小麦、大豆」を単に「穀類」とする）。
    ヒント: 例外は6つだけです：たんぱく加水分解物（魚介類）、魚醤（魚介類）、魚醤パウダー（魚介類）、魚肉すり身（魚介類）、魚油（魚介類）、魚介エキス（魚介類）。網で無分別に捕獲するため種類を把握できない場合に限られます。
    機械判定:
      種別: 大分類表記

  - id: allergen-egg-white-yolk
    名称: 「卵白」「卵黄」は拡大表記による省略ができない
    根拠: 別添 アレルゲンを含む食品に関する表示 別表3 注記
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 原材料に「卵白」または「卵黄」があるとき
    判定: 「卵白（卵を含む）」のように、含む旨を省略せずに表示していること
    重大度: error
    メッセージ: 「卵白」「卵黄」は「卵」の字を含みますが、事故防止の観点から拡大表記としての省略は認められていません。「（卵を含む）」を付けてください。
    ヒント: 一括表示方式の場合は「（一部に卵を含む）」に卵が入っていればOKです。
    機械判定:
      種別: 卵白卵黄

  - id: allergen-contamination-note
    名称: コンタミネーションの注意喚起（推奨）
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(5)
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 製造ラインで他製品の特定原材料等が混入する可能性を排除できないとき
    判定: 防止対策を徹底した上で、なお可能性が排除できない場合に注意喚起表記を行うこと
    重大度: warn
    メッセージ: 同じ製造ラインで特定原材料等を扱っている場合、まず洗浄・製造順序・専用器具などの対策を徹底し、それでも可能性が残る場合に枠外で注意喚起することが推奨されています。
    ヒント: 書き方の例：「本品製造工場では、そば・落花生を含む製品を生産しています」。これは一括表示枠の外に書きます。
    機械判定:
      種別: 確認事項

  - id: allergen-scope-disclosure
    名称: 表示対象が9品目か29品目かを枠外に示す（推奨）
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(6)⑥
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: アレルゲン表示の対象が「特定原材料9品目」か「29品目」かを一括表示の外に表示するよう努めること
    重大度: warn
    メッセージ: アレルゲン表示の対象範囲（9品目のみか、準ずるものを含む29品目か）を一括表示の枠外に書くことが推奨されています。
    ヒント: 9品目のみを対象としている場合は、ウェブサイトや電話での問合せ対応など、情報提供の充実も求められています。
    機械判定:
      種別: 確認事項

  - id: allergen-cross-check-keyword
    名称: 原材料名とアレルゲン指定の食い違い検出
    根拠: 別添 アレルゲンを含む食品に関する表示 別表3（代替表記等方法リスト）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 原材料名・添加物名に特定原材料等の名称・代替表記・拡大表記が含まれるとき
    判定: その原材料に対して同じアレルゲンが指定されていること
    重大度: warn
    メッセージ: 原材料「{原材料}」の名前には「{品目}」が含まれているように見えますが、この原材料のアレルゲン指定に「{品目}」がありません。指定漏れではないか確認してください。
    ヒント: これは入力ミスを見つけるための補助チェックです。名称がたまたま似ているだけの場合（例：「たまごボーロ風味パウダー」に卵が入っていない等）は無視して構いません。
    機械判定:
      種別: アレルゲン整合性

  - id: allergen-trace-amount
    名称: 意図しない使用でも特定原材料は表示が必要
    根拠: 別添 アレルゲンを含む食品に関する表示 第1-3(6)①
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 原材料としての使用の意図にかかわらず、特定原材料を含む場合は表示していること
    重大度: warn
    メッセージ: 食物アレルギーはごく微量でも発症することがあるため、原材料として意図して使ったかどうかにかかわらず、特定原材料を含む場合は表示が必要です。配合表だけでなく仕入原料の規格書まで遡って確認してください。
    ヒント: 特定原材料を含むか否かの検証は書面で行うことになるため、製造記録・原料規格書を適切に保管する必要があります（別添 第2-1）。
    機械判定:
      種別: 確認事項
