# ============================================================
# 食品関連事業者／表示様式・文字サイズに関するルール
# ============================================================

分類: 事業者・様式
説明: 製造者等の表示、別記様式1の体裁、文字の大きさ、表示可能面積による省略に関するルール。

ルール:
  - id: business-name-required
    名称: 食品関連事業者の氏名または名称の表示義務
    根拠: 食品表示基準 第3条第1項（食品関連事業者の氏名又は名称及び住所）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 事業者の氏名または名称が入力されていること
    重大度: error
    メッセージ: 「食品関連事業者の氏名又は名称」は必ず表示しなければならない事項です。空欄になっています。
    ヒント: 表示内容に責任を持つ事業者を書きます。事項名は「製造者」のほか「加工者」「輸入者」「販売者」の場合もあります。
    機械判定:
      種別: 必須項目
      対象: 事業者.名称

  - id: business-address-required
    名称: 食品関連事業者の住所の表示義務
    根拠: 食品表示基準 第3条第1項（食品関連事業者の氏名又は名称及び住所）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 事業者の住所が入力されていること
    重大度: error
    メッセージ: 「食品関連事業者の住所」は必ず表示しなければならない事項です。空欄になっています。
    ヒント: 都道府県から番地まで書きます。ビル名等は省略できる場合があります。
    機械判定:
      種別: 必須項目
      対象: 事業者.住所

  - id: business-category
    名称: 事項名（製造者・加工者・販売者・輸入者）の選択
    根拠: 食品表示基準 第3条第1項／別記様式1
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 実態に合った事項名が選ばれていること
    重大度: warn
    メッセージ: 事項名（製造者／加工者／販売者／輸入者）が実態と合っているか確認してください。
    ヒント: 自社工場で製造していれば「製造者」、他社に製造委託して自社ブランドで売るなら「販売者」、輸入品なら「輸入者」となるのが基本です。製造所と表示責任者が異なる場合は、製造所の所在地・製造者名の表示（または製造所固有記号）も必要です。
    機械判定:
      種別: 確認事項

  - id: manufacturer-outside-frame
    名称: 販売者を枠内に書く場合の製造所の表示
    根拠: 食品表示基準 第3条第1項（製造所又は加工所の所在地及び製造者又は加工者の氏名又は名称）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 事項名に「販売者」を選んだとき（表示責任者と製造所が異なるとき）
    判定: 製造所の所在地と製造者の氏名または名称を表示していること（一括表示の枠外でも可）。または製造所固有記号を用いていること
    重大度: warn
    メッセージ: 「販売者」を表示した場合でも、製造所の所在地と製造者の氏名または名称の表示が必要です。枠内に入りきらないときは枠外に表示できますが、表示自体を省略することはできません（製造所固有記号を届け出て使う場合を除く）。
    ヒント: |
      実際の市販品では、枠内に「販売者　○○株式会社」、枠のすぐ外に「製造所　△△食品株式会社　◇◇県…」と並べる例がよくあります。
      これは適法な書き方です。枠外に書く場合も、所在地と製造者名の両方が必要です。
      このツールの入力欄は枠内の事業者を入力するためのものです。枠外に書く製造所の表示は、
      「枠外の注意喚起など（任意）」の欄に書いておくと、ラベル案の枠の下に並べて確認できます。
    機械判定:
      種別: 確認事項
    適用条件:
      - 対象: 事業者.区分
        演算: 等しい
        値: 販売者

  - id: manufacturing-code
    名称: 製造所固有記号を使う場合の要件
    根拠: 食品表示基準 第3条第1項ただし書／食品表示ガイド 早わかり「製造所固有記号」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 製造所固有記号を使用するとき
    判定: 原則として同一製品を2以上の製造所で製造していること、記号に「＋」を冠すること、応答義務に対応する表示があること
    重大度: error
    メッセージ: 製造所固有記号を使う場合は、(1) 原則として同一製品を2以上の製造所で製造していること (2) 事業者の住所・氏名の次に「＋」を冠して表示すること (3) 応答義務の表示（問合せ先電話番号／ウェブサイト／全製造所の一覧のいずれか）が必要です。
    ヒント: |
      「同一製品」とは、同一の規格で同一の包材を使用した製品です。
      内容量が異なるもの、キャンペーン仕様のデザインが印刷されているものは同一製品に該当しません。
      届出は「製造所固有記号制度届出データベース」でオンライン手続により行います。
    機械判定:
      種別: 製造所固有記号
    適用条件:
      - 対象: 製造所固有記号
        演算: 空でない

  - id: layout-format-1
    名称: 別記様式1により一括して表示する
    根拠: 食品表示基準 第8条／別記様式1
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 容器包装の見やすい箇所に、別記様式1により一括して表示していること
    重大度: warn
    メッセージ: 義務表示事項は、容器包装の見やすい箇所に「別記様式1」の枠でまとめて表示します。項目がばらばらの場所に散っていないか確認してください。
    ヒント: |
      様式の枠が記載困難な場合や、事項名を表示し他の事項と混同しない場合は、枠を省略したり別の場所に表示できる例外があります。
      枠内に入りきらない事項を枠外に表示することもできます。よくある例は次の3つです。
      ・期限：枠内に「この面の右側に記載」等の記載場所を書き、日付は枠外に印字する
      ・製造所：枠内は「販売者」、枠のすぐ外に「製造所　△△食品株式会社　◇◇県…」と表示する
      ・コンタミネーションの注意喚起（「本品製造工場では、そば・落花生を含む製品を生産しています」）は枠外に書くのが通例です
      いずれも、表示そのものを省略してよいという意味ではありません。
    機械判定:
      種別: 確認事項

  - id: font-size-8pt
    名称: 文字の大きさは8ポイント以上
    根拠: 食品表示基準 第22条（文字及び枠の色、活字の大きさ）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 表示可能面積がおおむね150平方センチメートルを超えるとき
    判定: 日本産業規格Z8305に規定する8ポイントの活字以上の大きさであること
    重大度: error
    メッセージ: 表示に用いる文字は8ポイント以上でなければなりません（現在の設定：{値}ポイント）。
    ヒント: 表示可能面積がおおむね150平方センチメートル以下の場合に限り、5.5ポイント以上まで小さくできます。
    機械判定:
      種別: 数値下限
      対象: 文字サイズ
      下限: 8
    適用条件:
      - 対象: 表示可能面積
        演算: 数値より大きい
        値: 150

  - id: font-size-5-5pt
    名称: 表示可能面積150平方センチメートル以下の場合は5.5ポイント以上
    根拠: 食品表示基準 第22条ただし書
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 表示可能面積がおおむね150平方センチメートル以下のとき
    判定: 5.5ポイントの活字以上の大きさであること
    重大度: error
    メッセージ: 表示可能面積が150平方センチメートル以下でも、文字は5.5ポイント以上でなければなりません（現在の設定：{値}ポイント）。
    ヒント: 「おおむね150平方センチメートル」の「おおむね」は、容器包装の形状や義務表示事項の字数が食品ごとに異なるため、150平方センチメートル以下を基本としつつ個々のケースで判断するという意味です。
    機械判定:
      種別: 数値下限
      対象: 文字サイズ
      下限: 5.5
    適用条件:
      - 対象: 表示可能面積
        演算: 数値以下
        値: 150

  - id: small-area-omission
    名称: 表示可能面積おおむね30平方センチメートル以下の省略
    根拠: 食品表示基準 第3条第3項／第5条
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 表示可能面積がおおむね30平方センチメートル以下のとき
    判定: 省略できる事項の範囲を正しく理解していること
    重大度: warn
    メッセージ: 表示可能面積がおおむね30平方センチメートル以下の場合、原材料名・添加物・内容量・栄養成分・製造所の所在地・原料原産地名・原産国名などを省略できます。ただしアレルゲン・期限表示・保存の方法・名称は省略できません。
    ヒント: 特定保健用食品・機能性表示食品、計量法の特定商品などは省略対象から除かれます。省略できるからといって、アレルゲン表示まで省略してはいけません。
    機械判定:
      種別: 確認事項
    適用条件:
      - 対象: 表示可能面積
        演算: 数値以下
        値: 30

  - id: nutrition-labeling-required
    名称: 栄養成分表示の義務（本ツールは対象外）
    根拠: 食品表示基準 第3条第1項（栄養成分の量及び熱量）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 熱量・たんぱく質・脂質・炭水化物・食塩相当量の表示があること
    重大度: warn
    メッセージ: 容器包装に入れられた消費者向けの加工食品には、熱量・たんぱく質・脂質・炭水化物・食塩相当量（ナトリウム）の表示が義務付けられています。本ツールv1は栄養成分表示の計算・検証には対応していないため、別途確認してください。
    ヒント: 表示順は定められています（熱量→たんぱく質→脂質→炭水化物→食塩相当量）。小規模事業者（課税売上高1000万円以下、または常時使用する従業員20人以下（商業・サービス業は5人以下））は当分の間、省略できます。
    機械判定:
      種別: 確認事項

  - id: prohibited-misleading
    名称: 表示禁止事項（誤認させる表示）
    根拠: 食品表示基準 第9条（表示禁止事項）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/
    最終確認日: ""
    条件: 常に適用する
    判定: 実際のものより著しく優良・有利であると誤認させる表示、表示事項の内容と矛盾する表示がないこと
    重大度: warn
    メッセージ: 一括表示枠の外の表示（キャッチコピー、イラスト、強調表示など）が、内容を誤認させるものになっていないか確認してください。
    ヒント: 「特色のある原材料」（特定の原産地、有機農産物など）を強調する場合は、その原材料の使用割合の表示が必要です（100%の場合は割合の表示を省略できます）。
    機械判定:
      種別: 確認事項
