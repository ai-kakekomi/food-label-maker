    代替表記: [蟹, カニ]
    拡大表記: [上海がに, カニシューマイ, マツバガニ]
  - 品目: くるみ
    代替表記: [クルミ]
    拡大表記: [くるみパン, くるみケーキ]
  - 品目: 小麦
    代替表記: [こむぎ, コムギ]
    拡大表記: [小麦粉, こむぎ胚芽]
  - 品目: そば
    代替表記: [ソバ]
    拡大表記: [そばがき, そば粉]
  - 品目: 卵
    代替表記: [玉子, たまご, タマゴ, エッグ, 鶏卵, あひる卵, うずら卵]
    拡大表記: [厚焼玉子, ハムエッグ]
    注意: 「卵白」「卵黄」は特定原材料名（卵）を含んでいるが、事故防止の観点から拡大表記として「卵を含む」の省略は不可。
  - 品目: 乳
    代替表記: [ミルク, バター, バターオイル, チーズ, アイスクリーム]
    拡大表記: [アイスミルク, 生乳, 牛乳, 濃縮乳, 脱脂粉乳, 加糖れん乳, 乳たんぱく, 調製粉乳, ガーリックバター, プロセスチーズ, 乳糖]
    表示形式: 乳成分を含む      # 原材料の場合。「乳を含む」ではない
    添加物表示形式: 乳由来      # 添加物の場合。「乳成分由来」ではない
  - 品目: 落花生
    代替表記: [ピーナッツ]
    拡大表記: [ピーナッツバター, ピーナッツクリーム]

