# ============================================================
# アレルゲン辞書（ルールではなく「データ」です）
#
# 出典：消費者庁「食品表示基準について 別添 アレルゲンを含む食品に関する表示」
#       別表3「特定原材料等の代替表記等方法リスト」
#       https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_230629_02.pdf
#       消費者庁 アレルゲン表示ポータル（2026年4月1日改正を確認）
#       https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/allergy/
# 最終確認日: "2026-08-20"
#
# 2026年4月1日施行の改正で、カシューナッツが特定原材料（義務表示）に
# 格上げされ、ピスタチオが特定原材料に準ずるものに追加されました
# （特定原材料9品目＋準ずるもの20品目＝計29品目）。
# カシューナッツの義務表示には2028年3月31日までの経過措置があります。
#
# 「代替表記」＝ 書き方は違うが特定原材料等と同じものだと分かる表記。
#                これで書いてあれば「（○○を含む）」を省略できます。
# 「拡大表記」＝ 名称の中に特定原材料等の名前や代替表記が入っているため、
#                それを使った食品だと分かる表記（例：えび天ぷら）。表記例です。
# ============================================================

種別: アレルゲン辞書

特定原材料:
  - 品目: えび
    代替表記: [海老, エビ]
    拡大表記: [えび天ぷら, サクラエビ]
  - 品目: カシューナッツ
    代替表記: []
    拡大表記: []
    注意: 2026年4月1日の改正で推奨表示から義務表示（特定原材料）に格上げ。経過措置は2028年3月31日まで（それ以降は表示義務違反）。新規に作るラベルでは表示すること。
