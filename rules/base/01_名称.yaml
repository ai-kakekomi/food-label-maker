# ============================================================
# 名称に関するルール
#
# このファイルは「食品業界の方が読んでレビューできる」ことを最優先に
# 書かれています。プログラムの知識は不要です。
# 各項目の意味は README.md の「ルールの直し方」を読んでください。
# ============================================================

分類: 名称
説明: 一括表示の「名称」欄に関するルール。

ルール:
  - id: name-required
    名称: 名称の表示義務
    根拠: 食品表示基準 第3条第1項（一般用加工食品の義務表示事項）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""        # 未監修（監修者がレビュー後に日付を記入してください）
    条件: 常に適用する
    判定: 名称欄が空でないこと
    重大度: error
    メッセージ: 「名称」は必ず表示しなければならない事項です。空欄になっています。
    ヒント: 商品のパッケージにある商品名（ブランド名）ではなく、その食品の中身を表す一般的な名称を書きます。例：「焼き菓子（クッキー）」「いちごジャム」
    機械判定:
      種別: 必須項目
      対象: 名称

  - id: name-not-brandname
    名称: 名称は一般的な名称であること（商品名・ブランド名は不可）
    根拠: 食品表示基準 第3条第1項／食品表示ガイド 早わかり「名称」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 名称欄に入力があるとき
    判定: その内容を表す一般的な名称になっていること
    重大度: warn
    メッセージ: 名称は「その内容を表す一般的な名称」で書きます。商品名・ブランド名・愛称になっていないか確認してください。
    ヒント: 「○○ちゃんのサクサククッキー」は商品名であって名称ではありません。「焼き菓子」「ビスケット」などが名称にあたります。
    機械判定:
      種別: 確認事項

  - id: name-legal-designated
    名称: 個別に名称の表示方法が定められた食品
    根拠: 食品表示基準 別表第4（別途名称の表示方法が定められている食品）／別表第5（他の食品に使用できない名称）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 別表第4に該当する食品であれば、その定めに従った名称であること
    重大度: warn
    メッセージ: この食品が「別表第4」で名称の表示方法が定められた食品（乳・乳製品、食肉製品、しょうゆ、食用油脂など）に該当しないか確認してください。該当する場合は定められた名称を使う必要があります。
    ヒント: 乳・乳製品は「乳及び乳製品の成分規格等に関する命令」の定義に従って種類別を表示します。また別表第5で定められた名称は、その加工食品以外には使えません。
    機械判定:
      種別: 確認事項
