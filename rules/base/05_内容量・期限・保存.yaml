# ============================================================
# 内容量／期限表示／保存の方法に関するルール
# ============================================================

分類: 内容量・期限・保存
説明: 一括表示の「内容量」「消費期限または賞味期限」「保存方法」に関するルール。

ルール:
  - id: quantity-required
    名称: 内容量の表示義務
    根拠: 食品表示基準 第3条第1項（内容量又は固形量及び内容総量）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 内容量欄が空でないこと
    重大度: error
    メッセージ: 「内容量」は必ず表示しなければならない事項です。空欄になっています。
    ヒント: 外見上容易に内容量が識別できるものは省略できる場合がありますが、計量法の特定商品に該当するものは省略できません。
    機械判定:
      種別: 必須項目
      対象: 内容量

  - id: quantity-unit
    名称: 内容量には単位を明記する
    根拠: 食品表示基準 第3条第1項（内容量）／食品表示ガイド 早わかり「内容量又は固形量及び内容総量」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 内容量欄に入力があるとき
    判定: グラム／キログラム／ミリリットル／リットル／個数等の単位が明記されていること
    重大度: error
    メッセージ: 内容量には単位を明記してください（重量はg・kg、体積はmL・L、数量は個・枚・袋など）。
    ヒント: 例：「100g」「500mL」「18枚（3枚×6袋）」。固形物に充てん液を加えて密封したものは「固形量」と「内容総量」を書く場合があります。
    機械判定:
      種別: 正規表現一致必須
      対象: 内容量
      パターン: "(g|ｇ|グラム|kg|ｋｇ|キログラム|ml|mL|ｍｌ|ミリリットル|[lL]|リットル|個|枚|本|袋|包|食|尾|丁|株|パック)"

  - id: date-required
    名称: 消費期限または賞味期限の表示義務
    根拠: 食品表示基準 第3条第1項（消費期限又は賞味期限）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 期限の種別と日付が入力されていること
    重大度: error
    メッセージ: 「消費期限」または「賞味期限」は必ず表示しなければならない事項です。
    ヒント: でん粉、チューインガム、冷菓、砂糖、アイスクリーム類、食塩及びうまみ調味料、酒類、氷など、品質の変化が極めて少ないものは省略できます。
    機械判定:
      種別: 必須項目
      対象: 期限.日付

  - id: date-type-selection
    名称: 消費期限と賞味期限の使い分け
    根拠: 食品表示基準 第2条第1項第9号・第10号／食品表示ガイド 早わかり「消費期限又は賞味期限」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 品質が急速に劣化する食品には「消費期限」、それ以外には「賞味期限」を選んでいること
    重大度: warn
    メッセージ: 品質が急速に劣化する食品には「消費期限」、それ以外の食品には「賞味期限」を表示します。選択が適切か確認してください。
    ヒント: 目安として、製造・加工から品質が保持される期間がおおむね5日以内のものは消費期限とされます。期限の設定は「食品期限表示の設定のためのガイドライン」に基づき、科学的・合理的根拠をもって事業者が行います。
    機械判定:
      種別: 確認事項

  - id: date-format-within-3months
    名称: 期限が3か月以内の場合の日付書式（年月日）
    根拠: 食品表示基準 別表第20／食品表示ガイド 早わかり「消費期限又は賞味期限 ①」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 製造または加工した日から期限までが3か月以内のとき
    判定: 年月日まで表示していること
    重大度: error
    メッセージ: 期限までの期間が3か月以内の場合は、年月日まで表示する必要があります。
    ヒント: |
      認められる書き方（いずれか）：
      ・令和6年11月30日　・06.11.30　・2024.11.30　・24.11.30
      「.」の印字が困難なときは省略できます。その場合、月や日が1桁のときは2桁目を「0」と表示します（例：2024 11 05 → 20241105）。
      消費期限は必ずこの形式です（3か月を超える消費期限は想定されません）。
      日付そのものを枠外に印字する場合は、枠内に記載場所を書きます（例：「この面の右側に記載」「箱の底面に記載」）。
      その書き方を入力したときは、日付の書式チェックは行いません（枠外に印字した日付の書式はご自身で確認してください）。
    機械判定:
      種別: 期限日付書式
      要求: 年月日

  - id: date-format-over-3months
    名称: 賞味期限が3か月を超える場合の日付書式（年月まで可）
    根拠: 食品表示基準 別表第20／食品表示ガイド 早わかり「消費期限又は賞味期限 ②」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 製造または加工した日から賞味期限までが3か月を超えるとき
    判定: 年月まで（または年月日）で表示していること
    重大度: warn
    メッセージ: 賞味期限までの期間が3か月を超える場合は「年月」までの表示にできます（年月日で表示しても構いません）。
    ヒント: |
      認められる書き方：令和6年11月／06.11／2024.11／24.11
      年月表示にする場合、賞味期限の日が月末でないときは前月末を表示するのが一般的な運用です（例：11月20日が期限 → 「2024.10」）。
      日付そのものを枠外に印字する場合は、枠内に記載場所を書きます（例：「この面の右側に記載」）。その書き方を入力したときは書式チェックを行いません。
    機械判定:
      種別: 期限日付書式
      要求: 年月

  - id: date-location-outside-frame
    名称: 期限を枠外に表示する場合は枠内に記載場所を書く
    根拠: 食品表示基準 第8条／加工食品の表示に関するQ&A（表示事項の記載場所）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/qa/processed_foods/
    最終確認日: ""
    条件: 期限の日付欄に日付ではなく記載場所（例：この面の右側に記載）を入力したとき
    判定: 枠内に記載場所を明示し、枠外の該当箇所に期限を実際に印字していること
    重大度: warn
    メッセージ: 期限を枠外に印字する表示方法です。枠内に書いた記載場所（例：「この面の右側に記載」）と、実際に印字する場所が一致しているか確認してください。
    ヒント: |
      一括表示の枠内に記載場所を明示すれば、期限を枠外（打刻・インクジェット印字など）に表示できます。
      枠外に印字する日付の書式（年月日か年月か）は、このツールでは確認できません。ご自身で確認してください。
      同じ考え方で、保存方法など他の事項も枠内に記載場所を書いて枠外に表示できる場合があります。
    機械判定:
      種別: 確認事項
    適用条件:
      - 対象: 期限.日付
        演算: 記載場所表記

  - id: storage-required
    名称: 保存の方法の表示義務
    根拠: 食品表示基準 第3条第1項（保存の方法）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 保存方法欄が空でないこと
    重大度: error
    メッセージ: 「保存の方法」は必ず表示しなければならない事項です。空欄になっています。
    ヒント: 「常温で保存すること以外にその保存方法に関し留意すべき事項がないもの」は省略できますが、書いておくのが一般的です。
    機械判定:
      種別: 必須項目
      対象: 保存方法

  - id: storage-before-opening
    名称: 保存方法は「開封前」の方法を書く
    根拠: 食品表示基準 第3条第1項（保存の方法）／食品表示ガイド 早わかり「保存の方法」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 保存方法欄に入力があるとき
    判定: 開封前の保存方法を、食品の特性に従って具体的に表示していること
    重大度: warn
    メッセージ: 保存の方法は「開封前」の保存方法を書きます。「10℃以下で保存すること」「直射日光を避け、常温で保存すること」のように具体的に書いてください。
    ヒント: 食品衛生法第13条第1項により保存基準が定められた食品（食肉製品、生食用鮮魚介類など）は、その基準に従って表示します。開封後の取扱いは任意表示として枠外に書きます。
    機械判定:
      種別: 確認事項
