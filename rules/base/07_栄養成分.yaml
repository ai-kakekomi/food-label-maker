# ============================================================
# 栄養成分表示に関するルール
#
# 対象は、義務表示の5項目（熱量・たんぱく質・脂質・炭水化物・食塩相当量）です。
# ビタミン・ミネラル等の任意表示成分は、このツールでは扱っていません。
# ============================================================

分類: 栄養成分
説明: 一括表示とは別の枠（別記様式2）で表示する、熱量と栄養成分の量に関するルール。

ルール:
  - id: nutrition-5-items-required
    名称: 栄養成分表示の5項目の表示義務
    根拠: 食品表示基準 第3条第1項の表「栄養成分（たんぱく質、脂質、炭水化物及びナトリウム）の量及び熱量」の項／別記様式2（第8条・第22条・第35条関係）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/nutrient_declearation/business/assets/food_labeling_cms206_250403_12.pdf
    最終確認日: "2026/8/10"
    条件: 栄養成分表示を省略しないとき
    判定: 熱量・たんぱく質・脂質・炭水化物・食塩相当量の5項目すべてに値が入っていること
    重大度: error
    メッセージ: 「{項目}」の値が入っていません。栄養成分表示では、熱量・たんぱく質・脂質・炭水化物・食塩相当量の5項目をすべて表示します。
    ヒント: |
      この5項目は、容器包装に入れられた一般用加工食品の義務表示です。
      ナトリウムは「食塩相当量」に換算して表示します（ナトリウムの量に2.54を掛けてミリグラムからグラムに直します）。
      値が「0と表示することができる量」を下回る場合は「0」と表示できます。
      表示を省略できる場合もあります。省略したいときは、入力欄の「栄養成分表示を省略する」にチェックを入れてください。
    機械判定:
      種別: 栄養成分5項目
    適用条件:
      - 対象: 栄養成分.省略
        演算: 偽

  - id: nutrition-item-order
    名称: 栄養成分表示の項目の順序
    根拠: 食品表示基準 別記様式2（第8条・第22条・第35条関係）／第8条第3号（表示の方式等）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/nutrient_declearation/business/assets/food_labeling_cms206_250403_12.pdf
    最終確認日: "2026/8/10"
    条件: 栄養成分表示を省略しないとき
    判定: 熱量→たんぱく質→脂質→炭水化物→食塩相当量の順に並んでいること
    重大度: error
    メッセージ: 栄養成分表示の項目の順序が別記様式2と違っています（{該当}）。熱量→たんぱく質→脂質→炭水化物→食塩相当量の順にしてください。
    ヒント: |
      別記様式2では並び順が決まっています。この順序は入れ替えられません。
      本ツールの入力欄はこの順序で固定しているので、通常このチェックで指摘が出ることはありません。
      ルールを書き換えて項目を増やしたときの安全装置として入れています。
    機械判定:
      種別: 栄養成分順序
    適用条件:
      - 対象: 栄養成分.省略
        演算: 偽

  - id: nutrition-value-numeric
    名称: 栄養成分の値は数値で表示する（単位はkcalとg）
    根拠: 食品表示基準 第3条第1項の表 栄養成分の量及び熱量の項の1の一・二／別表第九（第3条ほか関係）第二欄
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/nutrient_declearation/business/assets/food_labeling_cms206_250403_12.pdf
    最終確認日: "2026/8/10"
    条件: 栄養成分表示を省略せず、値を入力したとき
    判定: 各項目の値が数値（または「20〜25」のような下限値・上限値）であること
    重大度: error
    メッセージ: 「{項目}」の値「{該当}」は数値として読み取れません。数値だけを入力してください（単位はツールが付けます）。
    ヒント: |
      単位は法令で決まっています。熱量は kcal、たんぱく質・脂質・炭水化物・食塩相当量は g です。
      入力欄には数値だけを入れてください。単位はラベル案に自動で付きます。
      幅を持たせて表示する場合は「20〜25」のように下限値と上限値を書けます。
    機械判定:
      種別: 栄養成分数値
    適用条件:
      - 対象: 栄養成分.省略
        演算: 偽

  - id: nutrition-food-unit
    名称: 何あたりの量かを表示する（食品単位）
    根拠: 食品表示基準 第3条第1項の表 栄養成分の量及び熱量の項の1（100g・100ml・1食分・1包装その他の一単位当たり。食品単位が1食分の場合は当該1食分の量を併記する）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/nutrient_declearation/business/assets/food_labeling_cms206_250403_12.pdf
    最終確認日: "2026/8/10"
    条件: 栄養成分表示を省略しないとき
    判定: 100g・100ml・1食分のいずれかを選び、1食分を選んだ場合は1食分の量（目安量）を併記していること
    重大度: error
    メッセージ: "{該当}"
    ヒント: |
      栄養成分表示には「何あたりの量か」を必ず書きます（例：栄養成分表示（100g当たり））。
      「1食分」を選んだ場合は、1食分が何グラム（何ミリリットル）なのかを併記しなければなりません
      （例：栄養成分表示（1食分（50g）当たり））。
      消費者に認識される単位であれば、1個当たり・1包装当たりなども使えます。
    機械判定:
      種別: 栄養成分食品単位
    適用条件:
      - 対象: 栄養成分.省略
        演算: 偽

  - id: nutrition-sodium-notation
    名称: 「ナトリウム」の表示だけでは足りない（食塩相当量が必要）
    根拠: 食品表示基準 第3条第1項の表 栄養成分の量及び熱量の項の1の一（ナトリウムの量は食塩相当量の文字を冠して表示）／第7条（任意表示）の表 ナトリウムの量の項（ナトリウム塩を添加していない食品に限る）／食品表示基準Q&A 加工－214・加工－232
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_labeling_act/assets/food_labeling_cms201_260401_18.pdf
    最終確認日: "2026/8/10"
    条件: ナトリウムの量を併記するとき
    判定: ナトリウム塩を添加していない食品であること、かつ食塩相当量を括弧書きで併記していること
    重大度: error
    メッセージ: "{該当}"
    ヒント: |
      栄養成分表示では、ナトリウムは「食塩相当量」に換算して表示します。「ナトリウム○mg」だけの表示はできません。
      ナトリウムの量を書けるのは、ナトリウム塩を添加していない食品の場合だけです。
      その場合も食塩相当量の表示は必要で、「ナトリウム○mg（食塩相当量○g）」のように括弧書きで併記します
      （食塩相当量を枠の外に書くことはできません）。
      換算式：食塩相当量(g) ＝ ナトリウム(mg) × 2.54 ÷ 1000
    機械判定:
      種別: 栄養成分ナトリウム併記
    適用条件:
      - 対象: 栄養成分.省略
        演算: 偽

  - id: nutrition-estimated-wording
    名称: 推定値で表示する場合の併記文言
    根拠: 食品表示基準 第3条第1項の表 栄養成分の量及び熱量の項の2の一（分析して得られた値とは一致しない可能性があることを示す表示）／消費者庁「初めて栄養成分表示をする方へ」（「推定値」または「この表示値は、目安です。」）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/health_promotion/business/pdf/food_labeling_cms206_20200401_04.pdf
    最終確認日: "2026/8/10"
    条件: 表示値を合理的な推定により求めたとき
    判定: 「推定値」または「この表示値は、目安です。」のいずれかを栄養成分表示に近接して表示していること
    重大度: error
    メッセージ: 推定値で表示する場合は、「推定値」または「この表示値は、目安です。」のどちらかを栄養成分表示のそばに書く必要があります。併記する文言を選んでください。
    ヒント: |
      原材料の配合から計算した値や、日本食品標準成分表から求めた値は「合理的な推定により得られた値」にあたります。
      分析して得られた値と一致しない可能性があることを示すため、上のどちらかの文言を書きます。
      一部の項目だけを推定値にすることもできます。その場合は「○○は推定値」のように、どの成分が推定値かが分かるように書きます。
      なお、栄養強調表示（「低カロリー」「減塩」など）をする場合は、推定値による表示はできません。
    機械判定:
      種別: 栄養成分推定値文言
    適用条件:
      - 対象: 栄養成分.省略
        演算: 偽

  - id: nutrition-estimated-basis-record
    名称: 推定値の根拠資料を保管する
    根拠: 食品表示基準 第3条第1項の表 栄養成分の量及び熱量の項の2の二（表示された値の設定の根拠資料を保管すること）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/nutrient_declearation/business/assets/food_labeling_cms206_250403_12.pdf
    最終確認日: "2026/8/10"
    条件: 表示値を合理的な推定により求めたとき
    判定: 表示値の設定根拠となる資料を保管していること
    重大度: warn
    メッセージ: 推定値で表示する場合は、表示値の根拠資料を保管する義務があります。用意できているか確認してください。
    ヒント: |
      根拠資料の例：採用した計算方法、引用したデータベースの名称、配合量が重量で書かれたレシピ、
      原材料の栄養成分の含有量を示すデータ、調理加工工程表、調理加工前後の重量変化率のデータ。
      保管期間の目安は、その資料をもとに表示を行う期間です。販売を終了する製品は、
      最後に製造した製品の期限が過ぎるまで保管します。
    機械判定:
      種別: 確認事項
    適用条件:
      - 対象: 栄養成分.省略
        演算: 偽
      - 対象: 栄養成分.値の性格
        演算: 等しい
        値: 推定値

  - id: nutrition-omission-requirements
    名称: 栄養成分表示を省略できる場合の要件
    根拠: 食品表示基準 第3条第3項の表 栄養成分の量及び熱量の項（表示可能面積おおむね30平方センチメートル以下・酒類・栄養の供給源としての寄与の程度が小さいもの・極めて短い期間で原材料が変更されるもの・消費税の免税事業者）／同 附則第6条第1項（当分の間、中小企業基本法第2条第5項の小規模企業者を含む）／第5条（義務表示の特例）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/health_promotion/business/pdf/food_labeling_cms206_20200401_05.pdf
    最終確認日: "2026/8/10"
    条件: 栄養成分表示を省略するとき
    判定: 省略できる要件に本当に当てはまるか確認していること
    重大度: warn
    メッセージ: 栄養成分表示を省略する設定になっています。省略できるのは決まった場合だけです。要件に当てはまるか確認してください。
    ヒント: |
      省略できるのは、次のいずれかに当てはまる場合です（栄養表示をしようとする場合、
      特定保健用食品・機能性表示食品を除く）。
      ・容器包装の表示可能面積がおおむね30平方センチメートル以下
      ・酒類
      ・栄養の供給源としての寄与の程度が小さいもの（例：香辛料、ハーブ、コーヒー豆など）
      ・極めて短い期間で原材料（配合割合を含む）が変更されるもの
      ・消費税の免税事業者（課税売上高1000万円以下）が販売するもの
      　当分の間、中小企業基本法の小規模企業者（従業員おおむね20人以下、商業・サービス業は5人以下）も含みます
      このほか、食品を製造・加工した場所で販売する場合や、不特定多数への譲渡（販売を除く）も表示が要りません。
      注意：小規模の事業者が製造した食品でも、それを仕入れて売る事業者が小規模でない場合は、
      その事業者が販売するときに栄養成分表示が必要になります。
      「カロリーひかえめ」などの栄養強調表示をする場合は、省略できません。
    機械判定:
      種別: 確認事項
    適用条件:
      - 対象: 栄養成分.省略
        演算: 真
