# ============================================================
# 原材料名に関するルール
# ============================================================

分類: 原材料名
説明: 一括表示の「原材料名」欄に関するルール。重量順・複合原材料・添加物との区分など。

ルール:
  - id: ingredient-required
    名称: 原材料名の表示義務
    根拠: 食品表示基準 第3条第1項（原材料名）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 常に適用する
    判定: 原材料が1つ以上入力されていること
    重大度: error
    メッセージ: 「原材料名」は必ず表示しなければならない事項です。原材料が1つも入力されていません。
    ヒント: 使用した原材料を、重量の多い順にすべて入力してください。
    機械判定:
      種別: 必須項目
      対象: 原材料一覧

  - id: ingredient-weight-order
    名称: 原材料は重量の多い順に表示する
    根拠: 食品表示基準 第3条第1項（原材料名）／食品表示ガイド 早わかり「原材料名 ①」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 原材料が2つ以上あるとき
    判定: 使用した原材料に占める重量の割合の高いものから順に並んでいること
    重大度: error
    メッセージ: 原材料は「重量の割合の高いものから順」に並べる必要があります。入力した並び順が実際の配合の重量順になっているか確認してください。
    ヒント: 配合表（レシピ）の重量と突き合わせて確認します。この確認は機械では判定できません。人が必ず確認してください。
    機械判定:
      種別: 確認事項

  - id: ingredient-common-name
    名称: 原材料は最も一般的な名称で表示する
    根拠: 食品表示基準 第3条第1項（原材料名）／食品表示ガイド 早わかり「原材料名 ①」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 原材料が1つ以上あるとき
    判定: 社内の略称や商品コードではなく、消費者が分かる一般的な名称であること
    重大度: warn
    メッセージ: 原材料名は「最も一般的な名称」で表示します。社内呼称・仕入先の商品名になっていないか確認してください。
    ヒント: 例：「A-102ミックス」→「小麦粉」「砂糖」…のように分けて書く、または複合原材料として内訳を書きます。
    機械判定:
      種別: 確認事項

  - id: ingredient-additive-separation
    名称: 原材料と添加物を明確に区分する
    根拠: 食品表示基準 第3条第1項（添加物）／食品添加物表示に関するマメ知識 p3
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/food_additive/assets/food_labeling_cms204_210408_01.pdf
    最終確認日: ""
    条件: 添加物を1つ以上使用しているとき
    判定: 「添加物欄を設ける」「スラッシュ（／）で区切る」「改行する」のいずれかで区分されていること
    重大度: error
    メッセージ: 添加物を使用している場合は、原材料と添加物が明確に区分されている必要があります。区分方法を選択してください。
    ヒント: 区分方法は3通りあります。(1)「添加物」の事項欄を別に設ける (2) 原材料名欄でスラッシュ「／」を入れる (3) 原材料名欄で改行する。
    機械判定:
      種別: 必須項目
      対象: 添加物区分方法
    適用条件:
      - 対象: 添加物一覧
        演算: 空でない

  - id: ingredient-compound
    名称: 複合原材料の内訳表示
    根拠: 食品表示基準 第3条第1項（原材料名）／食品表示基準Q&A 加工-51〜54
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 2種類以上の原材料からなる複合原材料を使用しているとき
    判定: 複合原材料名の後ろに括弧を付け、その中身を重量の多い順に表示していること
    重大度: warn
    メッセージ: 複合原材料（例：しょうゆ、マヨネーズ、あん、たれ など）を使っている場合は、原則としてカッコ書きで中身を重量順に表示します。
    ヒント: |
      省略できる場合もあります。
      ・中身が3種類以上あり、3位以下かつ5%未満のものは「その他」とまとめられる
      ・複合原材料が製品全体の5%未満、または名称から中身が明らかな場合（例：マヨネーズ）は内訳を省略できる
    機械判定:
      種別: 確認事項

  - id: ingredient-compound-other
    名称: 複合原材料で「その他」とまとめられる条件
    根拠: 食品表示基準 第3条第1項（原材料名）／食品表示ガイド 早わかり「原材料名 ②(ア)」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 複合原材料の内訳に「その他」を使っているとき
    判定: 「その他」とできるのは、複合原材料の中で重量順3位以下かつ5%未満の原材料のみであること
    重大度: warn
    メッセージ: 複合原材料の内訳を「その他」とまとめられるのは、その複合原材料の中で「重量順3位以下」かつ「5%未満」の原材料だけです。条件を満たしているか確認してください。
    ヒント: 5%以上使っている原材料は、3位以下でも「その他」にはできません。
    機械判定:
      種別: 確認事項

  - id: origin-of-material
    名称: 原料原産地名の表示（重量順1位の原材料）
    根拠: 食品表示基準 第3条第2項（原料原産地名）／食品表示ガイド 早わかり「原料原産地表示」
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 国内で製造した加工食品であるとき
    判定: 重量割合が最も高い原材料（対象原材料）について原産地が表示されていること
    重大度: error
    メッセージ: 国内で製造した加工食品は、原則として重量割合1位の原材料の原産地（原料原産地名）を表示する必要があります。
    ヒント: |
      ・1位の原材料が生鮮食品なら「国産」または原産国名（例：豚肉（アメリカ））
      ・1位の原材料が加工食品なら「国内製造」または「○○製造」（例：小麦粉（国内製造））
      ・2か国以上を混合する場合は重量順に国名を並べ、3か国目以降は「その他」とできる
      ・別表第15の1に定める22食品群と、農産物漬物・野菜冷凍食品・うなぎ加工品・かつお削りぶし・おにぎりは個別の規定があります
    機械判定:
      種別: 必須項目
      対象: 原料原産地名
    適用条件:
      - 対象: 輸入品
        演算: 偽

  - id: origin-country-import
    名称: 輸入品の原産国名表示
    根拠: 食品表示基準 第3条第2項（原産国名）
    出典URL: https://www.caa.go.jp/policies/policy/food_labeling/information/pamphlets/assets/food_labeling_cms201_250512_02.pdf
    最終確認日: ""
    条件: 輸入品であるとき
    判定: 原産国名が表示されていること
    重大度: error
    メッセージ: 輸入品には「原産国名」の表示が必要です（原料原産地名ではありません）。
    ヒント: 輸入品の場合、原料原産地名の表示は不要で、代わりに原産国名を表示します。
    機械判定:
      種別: 必須項目
      対象: 原産国名
    適用条件:
      - 対象: 輸入品
        演算: 真
