# ============================================================
# 社内ルール（カスタムルール）のサンプルテンプレート
#
# 使い方（このファイルを自分で書き換える必要はありません）
#   1. AIコーディングエージェント（Claude Code など）にこのフォルダを渡し、
#      社内ルールを日本語で説明して「読み込める形のファイルを作って」と頼みます
#   2. ツールの画面「9. 社内ルールの読み込み」で、作ってもらったファイルを選びます
#
#   手順は使い方マニュアルの7章「自分用に変えたい（AIに頼む）」にあります。
#   このファイルは、AIが書き方を参考にするための見本です。
#
# 法令ルール（rules/base/）とは画面上で区別して表示されます。
# 社内ルールは法令ではないので、根拠には社内規程の名前を書いてください。
#
# 【書き方の注意】
#   「根拠」は「社内表示規程 第5条」のように規程の名前と条番号だけを書きます。
#   規程の本文や社内の数値基準の詳細、未発表の商品名・配合量・取引先名は書かないでください。
#   （このフォルダをAIに渡すと、その中身はAI事業者に送られます）
# ============================================================

分類: 社内ルール
種別: カスタム
説明: 自社の社内規程・慣行を法令ルールと同じ形式で追加するためのサンプルです。

ルール:
  # ------------------------------------------------------------------
  # 例1：入力が空でないことを確認する（種別：必須項目）
  # ------------------------------------------------------------------
  - id: custom-storage-fixed-wording
    名称: 【社内】保存方法の文言を統一する
    根拠: 社内表示規程 第5条
    出典URL: https://example.com/内部規程へのリンク
    最終確認日: "2026/8/3"
    条件: 常温流通品であるとき
    判定: 保存方法が社内標準文言と一致すること
    重大度: warn
    メッセージ: 【社内ルール】常温品の保存方法は「直射日光、高温多湿を避けて保存してください」に統一してください。
    ヒント: 表現ゆれがあると印刷版下の管理が煩雑になるため、社内で文言を固定しています。
    機械判定:
      種別: 正規表現一致必須
      対象: 保存方法
      パターン: "直射日光、高温多湿を避けて保存してください"

  # ------------------------------------------------------------------
  # 例2：使ってはいけない言葉を検出する（種別：正規表現禁止）
  # ------------------------------------------------------------------
  - id: custom-banned-words
    名称: 【社内】使用禁止ワード
    根拠: 社内表示規程 第9条（禁止表現一覧）
    出典URL: https://example.com/内部規程へのリンク
    最終確認日: "2026/8/3"
    条件: 常に適用する
    判定: 禁止ワードが含まれていないこと
    重大度: error
    メッセージ: 【社内ルール】社内で使用を禁止している表現が含まれています。
    ヒント: 「完全無添加」「体にやさしい」等は、優良誤認のリスクがあるため社内で使用を禁止しています。
    機械判定:
      種別: 正規表現禁止
      対象: 全文
      パターン: "完全無添加|体にやさしい|安心・安全"

  # ------------------------------------------------------------------
  # 例3：人が目で確認する項目（種別：確認事項）
  #      機械では判定できないが、チェックリストとして必ず出したい項目
  # ------------------------------------------------------------------
  - id: custom-double-check
    名称: 【社内】版下は2名でダブルチェックする
    根拠: 社内品質保証手順書 QA-012
    出典URL: https://example.com/内部規程へのリンク
    最終確認日: "2026/8/3"
    条件: 常に適用する
    判定: 表示作成者とは別の担当者が確認し、記録を残していること
    重大度: warn
    メッセージ: 【社内ルール】表示版下は作成者と別の担当者によるダブルチェックが必要です。チェック記録を残してください。
    ヒント: チェック記録は品質保証部で3年間保管します。
    機械判定:
      種別: 確認事項

# ------------------------------------------------------------------
# 【機械判定の「種別」に使えるもの一覧】
#   必須項目          … 指定した欄が空でないこと
#   正規表現一致必須  … 指定した欄が、指定した文字パターンを含むこと
#   正規表現禁止      … 指定した欄に、指定した文字パターンが含まれないこと
#   数値下限          … 指定した欄の数値が下限以上であること
#   確認事項          … 機械では判定せず、人が確認するチェックリストに出す
#
#   ※アレルゲン関係の専用判定（アレルゲン表示 など）は法令ルール専用です。
#
# 【「対象」に指定できる欄の名前】
#   名称 / 原材料一覧 / 添加物一覧 / 内容量 / 保存方法 / 原料原産地名 /
#   原産国名 / 期限.種別 / 期限.日付 / 事業者.区分 / 事業者.名称 /
#   事業者.住所 / 製造所固有記号 / 文字サイズ / 表示可能面積 /
#   添加物区分方法 / アレルゲン表示方式 / アレルゲン一括文 / 注意喚起 /
#   全文（一括表示のすべてのテキストをまとめたもの）
# ------------------------------------------------------------------
